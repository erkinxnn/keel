name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest (test-only dependency)
        run: python -m pip install pytest
      - name: Selftest, pytest, hook end-to-end, adversarial probes
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/run_checks.py
